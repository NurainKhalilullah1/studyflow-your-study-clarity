name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://www.nexgenu.cyou' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'qecpaduxewgnumrjrroo' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlY3BhZHV4ZXdnbnVtcmpycm9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2ODkwNzIsImV4cCI6MjA4MzI2NTA3Mn0.7pVxkUZDlhXHfvI1yqRi6X_GtLIPo78occhww6khmSM' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qecpaduxewgnumrjrroo.supabase.co' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCMiRw4rXwfs6QT9UHewTFJ8NTQ1HQoND8' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'studyflow-8b49d.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'studyflow-8b49d' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'studyflow-8b49d.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '845420711121' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:845420711121:web:9c1db4801da894dae3c9f0' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-KKX4DZF5LB' }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY || 'BIMHs11tiXtH8BEEVEYZtb4XuZWqqV9lVWsQILpWa-G6SI80UCeBClnsziHh0Oc58HUez2Qbt8VBBaXIbs8LoYc' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare debug keystore (restore from secret or generate fresh)
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          GENERATED=false
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" \
              | tr -d '[:space:]' \
              | base64 --decode --ignore-garbage > ~/.android/debug.keystore 2>/dev/null \
              && echo "Restored stable debug keystore from secret." \
              || GENERATED=true
          else
            GENERATED=true
          fi
          if [ "$GENERATED" = "true" ]; then
            echo "Generating a fresh debug keystore (secret missing or invalid)."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Fresh debug keystore generated."
          fi


      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Print debug keystore SHA-1 (register this in Google Cloud Console)
        run: |
          echo "========================================================"
          echo "  DEBUG KEYSTORE SHA-1 (add to Google Cloud Console)"
          echo "========================================================"
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep -E "SHA1:|SHA-1:" || true
          echo "========================================================"

      - name: Export debug keystore as base64 (save as ANDROID_DEBUG_KEYSTORE_BASE64 secret)
        run: |
          echo "========================================================"
          echo "  SAVE THIS AS GITHUB SECRET: ANDROID_DEBUG_KEYSTORE_BASE64"
          echo "  (Settings → Secrets → Actions → New repository secret)"
          echo "========================================================"
          base64 -w 0 ~/.android/debug.keystore
          echo ""
          echo "========================================================"


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

